asyncapi: 3.0.0

info:
  title: Identitet uppdaterad event Async API
  version: 0.1.0
  description: |-
    Async API för identitetsändringar.

    När identitetsdata uppdateras av en extern källa publiceras ett IdentitetUppdateradEvent
    till det topic som angavs vid registrering.

channels:
  identitet.uppdaterad:
    address: identitet.uppdaterad
    messages:
      IdentitetUppdateradEvent:
        $ref: "#/components/messages/IdentitetUppdateradEvent"

operations:
  PublishIdentitetUppdaterad:
    action: send
    summary: Publicerar ett event när identitetsdata har uppdaterats av en extern källa
    channel:
      $ref: "#/channels/identitet.uppdaterad"
    messages:
      - $ref: "#/channels/identitet.uppdaterad/messages/IdentitetUppdateradEvent"

components:
  messages:
    IdentitetUppdateradEvent:
      payload:
        $ref: "#/components/schemas/IdentitetUppdateradEvent"

  schemas:
    IdentitetUppdateradEvent:
      type: object
      title: IdentitetUppdateradEvent
      description: Indikerar att identitetsdata har förändrats för den angivna identiteten. Eventet innehåller inte det uppdaterade datat — mottagaren ansvarar för att hämta aktuell information via lämpligt gränssnitt.
      required:
        - prenumerationId
      properties:
        prenumerationId:
          type: string
          format: uuid
          description: ID som kopplar eventet till den prenumeration som utlöste det
